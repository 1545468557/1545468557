<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">zhouxiang Explore Mode</title>
  <desc id="desc">An animated top-down rover travels around a portfolio build map with four project signals.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#171716" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8ef"/><stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <radialGradient id="map" cx="50%" cy="43%" r="60%">
      <stop stop-color="#cbbda8"/><stop offset=".72" stop-color="#9c8b76"/><stop offset="1" stop-color="#746657"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="7" dy="8" stdDeviation="0" flood-color="#171716"/>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <path id="route" d="M470 280C495 135 680 110 838 181C934 224 924 342 814 377C660 426 481 382 470 280Z"/>
  </defs>
  <style>
    .mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}
    .pulse{transform-origin:center;animation:pulse 2.2s ease-in-out infinite}.p2{animation-delay:.45s}.p3{animation-delay:.9s}.p4{animation-delay:1.35s}.blink{animation:blink 1s steps(1) infinite}.dash{stroke-dasharray:9 13;animation:dash 16s linear infinite}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}@keyframes blink{50%{opacity:.18}}@keyframes dash{to{stroke-dashoffset:-220}}
    @media(prefers-reduced-motion:reduce){.pulse,.blink,.dash{animation:none}}
  </style>
  <rect x="8" y="8" width="984" height="444" rx="22" fill="#171716"/>
  <rect x="1" y="1" width="984" height="444" rx="22" fill="url(#paper)" stroke="#171716" stroke-width="2"/>
  <rect x="1" y="1" width="984" height="444" rx="22" fill="url(#grid)"/>
  <path d="M1 62H985" stroke="#171716" stroke-width="2"/>
  <rect x="25" y="19" width="74" height="28" rx="14" fill="#171716"/>
  <text x="62" y="38" class="mono" font-size="12" font-weight="800" text-anchor="middle" fill="#fffaf0">ZX</text>
  <text x="120" y="39" class="mono" font-size="12" font-weight="700" letter-spacing="1.8" fill="#171716">EXPLORE MODE // GITHUB PREVIEW</text>
  <circle cx="949" cy="33" r="5" fill="#687b52" class="pulse"/>
  <text x="934" y="38" class="mono" font-size="11" text-anchor="end" fill="#6f6a61">SIGNAL: LIVE</text>

  <g transform="translate(54 105)">
    <text x="0" y="0" class="mono" font-size="12" font-weight="800" letter-spacing="2" fill="#b64b37">ZHOUXIANG BUILD MAP</text>
    <text x="0" y="62" class="serif" font-size="50" fill="#171716">Follow the</text>
    <text x="0" y="116" class="serif" font-size="50" fill="#171716">project signals<tspan fill="#b64b37">.</tspan></text>
    <text x="0" y="161" class="sans" font-size="15" fill="#6f6a61">Four experiments. One moving build log.</text>
    <text x="0" y="213" class="mono" font-size="12" fill="#171716">AUTO DRIVE <tspan fill="#b64b37" class="blink">●</tspan></text>
    <text x="0" y="242" class="mono" font-size="11" fill="#898278">GitHub blocks WASD input</text>
  </g>

  <ellipse cx="707" cy="269" rx="238" ry="147" fill="#171716" opacity=".18" transform="translate(6 9)"/>
  <ellipse cx="707" cy="269" rx="238" ry="147" fill="url(#map)" stroke="#171716" stroke-width="3"/>
  <ellipse cx="707" cy="269" rx="205" ry="116" fill="none" stroke="#eee9df" stroke-width="12" stroke-opacity=".72"/>
  <ellipse cx="707" cy="269" rx="181" ry="94" fill="none" stroke="#171716" stroke-width="2" stroke-opacity=".38" class="dash"/>
  <path d="M559 281l62-54 61 30 61-60 89 61M607 330l71-49 75 37 90-50" fill="none" stroke="#f6efe2" stroke-width="3" stroke-opacity=".48"/>

  <g>
    <circle cx="543" cy="225" r="17" fill="#fbf8ef" stroke="#171716" stroke-width="2"/><circle cx="543" cy="225" r="7" fill="#d46c45" class="pulse"/><text x="543" y="259" class="mono" font-size="10" text-anchor="middle" fill="#171716">CIJIAN</text>
    <circle cx="829" cy="178" r="17" fill="#fbf8ef" stroke="#171716" stroke-width="2"/><circle cx="829" cy="178" r="7" fill="#71865a" class="pulse p2"/><text x="829" y="151" class="mono" font-size="10" text-anchor="middle" fill="#171716">MYSTERY</text>
    <circle cx="868" cy="326" r="17" fill="#fbf8ef" stroke="#171716" stroke-width="2"/><circle cx="868" cy="326" r="7" fill="#c99b48" class="pulse p3"/><text x="868" y="360" class="mono" font-size="10" text-anchor="middle" fill="#171716">PET NAME</text>
    <circle cx="634" cy="380" r="17" fill="#fbf8ef" stroke="#171716" stroke-width="2"/><circle cx="634" cy="380" r="7" fill="#786b94" class="pulse p4"/><text x="634" y="414" class="mono" font-size="10" text-anchor="middle" fill="#171716">SKILL</text>
  </g>

  <g transform="translate(682 247) rotate(-8)" filter="url(#shadow)">
      <rect x="1" y="8" width="62" height="28" rx="8" fill="#db7147" stroke="#171716" stroke-width="2"/>
      <rect x="15" y="1" width="33" height="21" rx="4" fill="#f5e9cc" stroke="#171716" stroke-width="2"/>
      <path d="M19 5h25v13H19z" fill="#183a38"/>
      <rect x="7" y="3" width="17" height="8" rx="2" fill="#dfb75f" stroke="#171716" stroke-width="1.5"/>
      <circle cx="14" cy="38" r="8" fill="#171716"/><circle cx="50" cy="38" r="8" fill="#171716"/>
      <circle cx="14" cy="38" r="3" fill="#c9c6bd"/><circle cx="50" cy="38" r="3" fill="#c9c6bd"/>
  </g>
  <circle r="6" fill="#b64b37" stroke="#fbf8ef" stroke-width="3">
    <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
  </circle>
  <text x="944" y="421" class="mono" font-size="11" font-weight="800" text-anchor="end" fill="#b64b37">ANIMATED README / NO JAVASCRIPT</text>
</svg>
