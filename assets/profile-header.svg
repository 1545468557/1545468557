<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">zhouxiang AI Build Studio</title>
  <desc id="description">A dark digital build board for AI applications, interactive prototypes, and practical tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/><stop offset=".55" stop-color="#0b1d2c"/><stop offset="1" stop-color="#102839"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/><stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#22d3ee" stop-opacity=".24"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#b6e7ed" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="panel"><rect x="1" y="1" width="1198" height="498" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
    .scan { animation: scan 5s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .flow { stroke-dasharray: 7 12; animation: flow 16s linear infinite; }
    @keyframes scan { 0%, 100% { transform: translateX(-160px); opacity: 0; } 15%, 85% { opacity: .7; } 50% { transform: translateX(1180px); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: .15; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes flow { to { stroke-dashoffset: -190; } }
    @media (prefers-reduced-motion: reduce) { .scan, .blink, .pulse, .flow { animation: none; } }
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="500" fill="url(#background)"/>
    <rect width="1200" height="500" fill="url(#grid)"/>
    <ellipse cx="940" cy="160" rx="360" ry="300" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="62" fill="#06101b" fill-opacity=".78"/>
    <path d="M0 62H1200" stroke="#86efff" stroke-opacity=".16"/>
    <rect x="28" y="20" width="86" height="24" rx="12" fill="#67e8f9" fill-opacity=".13" stroke="#67e8f9" stroke-opacity=".55"/>
    <circle cx="46" cy="32" r="4" fill="#86efac" class="pulse"/>
    <text x="58" y="37" class="mono" font-size="11" font-weight="700" fill="#a5f3fc">ZX / AI</text>
    <text x="136" y="37" class="mono" font-size="12" letter-spacing="1.5" fill="#7598a8">BUILD STUDIO // PUBLIC LOG</text>
    <text x="1168" y="37" class="mono" font-size="11" text-anchor="end" fill="#86efac">STATUS: ONLINE</text>
    <g transform="translate(54 102)">
      <text x="0" y="18" class="mono" font-size="13" font-weight="700" letter-spacing="2.1" fill="#67e8f9">ZHOUXIANG / AI BUILDER</text>
      <text x="0" y="92" class="sans" font-size="54" font-weight="750" letter-spacing="-2" fill="#eefcff">Build AI ideas</text>
      <text x="0" y="151" class="sans" font-size="54" font-weight="750" letter-spacing="-2" fill="#eefcff">into <tspan fill="url(#accent)">useful things.</tspan></text>
      <text x="2" y="196" class="sans" font-size="17" fill="#91aebe">Applications, interactive prototypes, and practical tools.</text>
      <text x="2" y="229" class="sans" font-size="17" fill="#91aebe">From first interaction to a working experience.</text>
    </g>
    <g transform="translate(726 100)">
      <rect width="420" height="248" rx="16" fill="#0a1723" fill-opacity=".86" stroke="#8deaf4" stroke-opacity=".24"/>
      <path d="M0 48H420" stroke="#8deaf4" stroke-opacity=".14"/>
      <circle cx="24" cy="24" r="5" fill="#fb7185"/><circle cx="43" cy="24" r="5" fill="#fbbf24"/><circle cx="62" cy="24" r="5" fill="#86efac"/>
      <text x="394" y="29" class="mono" font-size="11" text-anchor="end" fill="#668696">zhouxiang@studio ~ %</text>
      <text x="26" y="84" class="mono" font-size="12" font-weight="700" fill="#67e8f9">01 / INTERACTION</text>
      <text x="202" y="84" class="mono" font-size="12" fill="#bed5df">web + 3D experiences</text>
      <path d="M26 103H394" stroke="#b6e7ed" stroke-opacity=".09"/>
      <text x="26" y="132" class="mono" font-size="12" font-weight="700" fill="#86efac">02 / INTELLIGENCE</text>
      <text x="202" y="132" class="mono" font-size="12" fill="#bed5df">memory + context + roles</text>
      <path d="M26 151H394" stroke="#b6e7ed" stroke-opacity=".09"/>
      <text x="26" y="180" class="mono" font-size="12" font-weight="700" fill="#c4b5fd">03 / TOOLING</text>
      <text x="202" y="180" class="mono" font-size="12" fill="#bed5df">skills + practical utilities</text>
      <text x="26" y="222" class="mono" font-size="12" fill="#6ce6ef">ready_to_build<tspan class="blink">_</tspan></text>
    </g>
    <g transform="translate(54 407)">
      <text x="0" y="7" class="mono" font-size="10" letter-spacing="1.7" fill="#668696">BUILD LOOP</text>
      <path d="M0 36H1092" fill="none" stroke="#7dd3fc" stroke-opacity=".26" class="flow"/>
      <g class="mono" font-size="11" font-weight="700">
        <circle cx="2" cy="36" r="7" fill="#07111f" stroke="#67e8f9"/><text x="2" y="64" text-anchor="middle" fill="#a8c2cd">DISCOVER</text>
        <circle cx="352" cy="36" r="7" fill="#07111f" stroke="#67e8f9"/><text x="352" y="64" text-anchor="middle" fill="#a8c2cd">PROTOTYPE</text>
        <circle cx="715" cy="36" r="7" fill="#07111f" stroke="#86efac"/><text x="715" y="64" text-anchor="middle" fill="#a8c2cd">TEST</text>
        <circle cx="1092" cy="36" r="7" fill="#07111f" stroke="#86efac"/><text x="1092" y="64" text-anchor="middle" fill="#a8c2cd">SHIP</text>
      </g>
    </g>
    <rect class="scan" x="0" y="62" width="110" height="338" fill="#67e8f9" opacity=".08"/>
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="20" fill="none" stroke="#75dceb" stroke-opacity=".28" stroke-width="2"/>
</svg>
